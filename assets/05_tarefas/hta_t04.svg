<text x="32" y="91" font-size="15" font-weight="400" text-anchor="start" fill="#213247" >Origem: P04 / C04 / R01, R04.  |  Revisão documental: 12/10/2026</text>
<text x="32" y="121" font-size="15" font-weight="400" text-anchor="start" fill="#52657a" >Árvore por expansões: encontre o ID do objetivo em seu painel. As condições completas estão na tabela do relatório.</text>
