<text x="32" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#213247" >Autoria: Pedro Henrique Satoru Lima Takahashi — 22.123.019-6</text>
<text x="32" y="91" font-size="15" font-weight="400" text-anchor="start" fill="#213247" >Origem: P03 / C03 / R02, R03.  |  Revisão documental: 12/10/2026</text>
