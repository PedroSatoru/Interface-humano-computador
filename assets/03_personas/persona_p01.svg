<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%">
  <defs>
    <linearGradient id="p01-grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p01-grad-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="p01-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="530" rx="14" fill="#f8fafc"/>
  <rect width="960" height="530" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M0 14C0 6.268 6.268 0 14 0H946C953.732 0 960 6.268 960 14V88H0V14Z" fill="url(#p01-grad-header)"/>

  <!-- Persona Avatar Circle -->
  <circle cx="68" cy="48" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M68 28L49 37L68 46L87 37L68 28Z" fill="#ffffff"/>
  <path d="M56 43V54C56 59 61 63 68 63C75 63 80 59 80 54V43" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M85 39V55" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="85" cy="57" r="2" fill="#bfdbfe"/>

  <!-- Header Info -->
  <text x="116" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Dra. Mariana Siqueira, 29 anos</text>
  <text x="116" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Doutoranda e Pesquisadora em Bioinformática e Neurociência Computacional</text>

  <!-- Badges Top Right -->
  <rect x="740" y="24" width="185" height="26" rx="13" fill="url(#p01-grad-badge)"/>
  <text x="832" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PERSONA PRIMÁRIA (P01)</text>

  <rect x="735" y="54" width="195" height="20" rx="10" fill="#334155"/>
  <text x="832" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Autor: Pedro Correia (22.222.009-7)</text>

  <!-- Left Column: Profile Card -->
  <g filter="url(#p01-shadow)">
    <rect x="25" y="104" width="280" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <text x="42" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Perfil e Hábitos</text>

  <text x="42" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Conhecimento de Domínio:</text>
  <text x="42" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Avançado em biologia molecular,</text>
  <text x="42" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">bioestatística e modelagem Python.</text>

  <text x="42" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Experiência com IA:</text>
  <text x="42" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Usa ChatGPT e Claude com frequência,</text>
  <text x="42" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">mas desconfia de conclusões longas.</text>

  <text x="42" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Ambiente de Trabalho:</text>
  <text x="42" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Laboratório acadêmico e home office;</text>
  <text x="42" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Notebook Dell 15" e monitor ultrawide.</text>

  <text x="42" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Comportamento Chave:</text>
  <text x="42" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Cética e investigativa; exige ver</text>
  <text x="42" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">o passo a passo dedutivo formal.</text>
  <text x="42" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Não aceita respostas prontas.</text>

  <rect x="40" y="456" width="250" height="26" rx="5" fill="#f1f5f9"/>
  <text x="165" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Hipóteses E1: H01 e H02</text>

  <!-- Right Top 1: Objetivos & Necessidades -->
  <g filter="url(#p01-shadow)">
    <rect x="325" y="104" width="300" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <rect x="325" y="104" width="4" height="190" rx="2" fill="#10b981"/>
  <text x="342" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">🎯 Objetivos e Necessidades</text>
  <text x="342" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Resolver questões GPQA complexas com alto</text>
  <text x="352" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">grau de certeza e rigor dedutivo.</text>
  <text x="342" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Evitar o decaimento de contexto (context rot)</text>
  <text x="352" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">em deduções encadeadas de várias etapas.</text>
  <text x="342" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Obter síntese explicativa clara para embasar</text>
  <text x="352" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">artigos acadêmicos e teses de pós-graduação.</text>
  <text x="342" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Auditar critérios de aceite em cada subtarefa.</text>

  <!-- Right Top 2: Dores e Frustrações -->
  <g filter="url(#p01-shadow)">
    <rect x="645" y="104" width="290" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <rect x="645" y="104" width="4" height="190" rx="2" fill="#ef4444"/>
  <text x="662" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">⚡ Dores e Frustrações</text>
  <text x="662" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Chatbots convencionais erram premissas</text>
  <text x="672" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">intermediárias e alucinam com tom seguro.</text>
  <text x="662" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Context rot silencioso: o modelo esquece</text>
  <text x="672" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">restrições definidas no início do prompt.</text>
  <text x="662" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Horas perdidas refazendo cálculos à mão</text>
  <text x="672" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">por não saber onde a IA começou a falhar.</text>
  <text x="662" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Insegurança ao citar IA sem rastreabilidade.</text>

  <!-- Right Bottom: Decisões de Design no Projeto de IHC -->
  <g filter="url(#p01-shadow)">
    <rect x="325" y="310" width="610" height="194" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <rect x="325" y="310" width="4" height="194" rx="2" fill="#3b82f6"/>
  <text x="342" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">💡 Decisões de Design Influenciadas por P01</text>

  <text x="342" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">1. Timeline Vertical de Open Thinking:</text>
  <text x="342" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Exibição de subtarefas atômicas em cards verticais para acompanhar o raciocínio em tempo real.</text>

  <text x="342" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">2. Badges de Critérios de Aceite (✓ e ✗):</text>
  <text x="342" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Sinalização visual imediata de checagens lógicas e autocrítica, comprovando refinamento antes da síntese.</text>

  <text x="342" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">3. Transparência de Contexto Limpo (Fresh Context):</text>
  <text x="342" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Indicador visual de contexto renovado em cada tarefa, comunicando proteção ativa contra context rot.</text>

  <text x="342" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">4. Exportação Rápida em Markdown:</text>
  <text x="342" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Botão para copiar síntese consolidada formatada para incorporação direta em artigos LaTeX e cadernos.</text>
</svg>